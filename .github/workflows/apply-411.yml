name: Apply Finance Tracker 4.1.1 source

on:
  push:
    branches: [main]
    paths:
      - ".ft411_payload/payload.b64"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify and unpack approved build
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ft411_payload/payload.b64 > /tmp/finance_tracker_4_1_1.zip
          echo "32760331ea0a3d1b6f204f9bd36e11783bf34ac1dd11159d241ef0727b8e690b  /tmp/finance_tracker_4_1_1.zip" | sha256sum -c -
          rm -rf /tmp/ft411
          mkdir -p /tmp/ft411
          unzip -q /tmp/finance_tracker_4_1_1.zip -d /tmp/ft411
          test -f /tmp/ft411/finance_tracker/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/ft411/finance_tracker/manifest.json')
          data=json.loads(p.read_text())
          assert data['domain']=='finance_tracker'
          assert data['version']=='4.1.1'
          PY
          rm -rf custom_components/finance_tracker
          mkdir -p custom_components
          cp -a /tmp/ft411/finance_tracker custom_components/finance_tracker
      - name: Update repository documentation
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # Finance Tracker HA2.0

          Finance Tracker HA2.0 is a local household-finance integration for Home Assistant. It provides a dedicated Finance sidebar with monthly bookings, accounts, categories, financial planning, monthly templates, plan/actual allocation, booking proposals and guided monthly closing.

          ## Highlights

          - Local SQLite data storage under `config/finance/household_v2.db`
          - German-first HA2.0 user interface
          - Account-owner and account master-data administration
          - Monthly booking overview by category and account
          - Financial planning with plan/actual comparison
          - Monthly templates and planning proposals
          - Explicit plan-to-actual allocation
          - Guided monthly closing and validation
          - Audit trail for subsequent booking changes
          - Integrated help and first-time setup guidance
          - Responsive mobile and desktop layout

          ## Data and privacy

          Finance Tracker HA2.0 is local-first. Household finance data is stored inside the Home Assistant configuration directory. The integration does not require a cloud account, bank login, API token or external finance service.

          The published source contains no household-specific owner names or personal default mappings. Account owners and account master data are created locally by the user.

          ## Installation

          Add this repository to Home Assistant Marketplace/HACS as a custom integration repository, install Finance Tracker HA2.0, restart Home Assistant, then add **Finance Tracker HA2.0** under **Settings → Devices & services**.

          ## Upgrade to 4.1.1

          Version 4.1.1 keeps the domain `finance_tracker` and the existing database path. It adds full account-owner administration, account creation/editing/deletion with referential-integrity protection, integrated help and first-time setup guidance, and removes household-specific defaults from the source.

          Existing installations are migrated automatically. Existing account IDs, transactions, categories, plan/actual links, templates and month closings are retained. No manual database migration is required.

          ## Support

          Issues and documentation are maintained in this repository under `sosshost/finance-tracker-ha2`.
          EOF

          cat > CHANGELOG.md <<'EOF'
          # Changelog

          ## 4.1.1 — Master data, onboarding and anonymization

          - Added persistent account-owner administration: create, rename and delete.
          - Added complete account administration: create, edit and delete.
          - Added referential-integrity protection so accounts in use cannot be destructively deleted.
          - Added migration of existing owner metadata without inferring personal identities from account names.
          - Added dynamic owner lists to account, planning and template pickers.
          - Added integrated help and first-time setup guidance in the main header.
          - Removed household-specific owner names, aliases and personal default mappings from source code.
          - Hardened form handling for account creation/editing and planning forms.
          - Updated frontend cache revision for the 4.1.1 build.
          - No manual database migration required.

          ## 4.1.0 — Independent Publication Baseline

          - Rebuilt the Home Assistant bootstrap and WebSocket registration structure.
          - Rebuilt frontend asset serving under `/api/finance_tracker/ui/`.
          - Removed the historical hidden planning sidebar registration.
          - Rewrote config flow and setup/translation text.
          - Replaced inherited brand artwork with a new original geometric Finance Tracker mark.
          - Added Marketplace/HACS repository metadata and validation workflow.
          - Kept the `finance_tracker` domain, `household_v2.db` data model and all active ledger/planning functionality.
          - No database migration required from 4.0.2.21.
          EOF
      - name: Validate source before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/finance_tracker
          find custom_components/finance_tracker -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('custom_components/finance_tracker').rglob('*.json'):
              json.loads(p.read_text())
          PY
          find custom_components/finance_tracker -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Commit approved 4.1.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/finance_tracker README.md CHANGELOG.md
          git commit -m "Update Finance Tracker HA2.0 to 4.1.1" || exit 0
          git push
