name: Publish approved release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Approved stable version (e.g. 4.2.2)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: finance-tracker-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate approved version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          v = os.environ["VERSION"].strip().removeprefix("v")
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v), "Stable version required"
          assert json.loads(Path("custom_components/finance_tracker/manifest.json").read_text())["version"] == v, "Manifest mismatch"
          assert Path("RELEASE_NOTES.md").is_file(), "Missing release notes"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              print(f"RELEASE_VERSION={v}", file=f)
          PY
          python -m compileall -q custom_components/finance_tracker
          find custom_components/finance_tracker -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file" || exit 1
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$RELEASE_VERSION"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Finance Tracker v$VERSION" --notes-file RELEASE_NOTES.md --latest
